# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Lists available tasks
    cmd: task --list

  setup:
    desc: Set up the local dev environment (installs npm deps and the lefthook git hook).
    cmds:
      - npm install
      - npx lefthook install

  qa:
    desc: Run every quality check on all files (exactly what CI's quality job runs).
    cmd: npm run lint:md

  qa:fix:
    desc: Auto-fix what can be auto-fixed (currently Markdown lint issues), on all files.
    cmd: npm run lint:md:fix
